// Work around dictionaries-common/aspell-autobuildhash trigger crashes in chroot builds.
DPkg::Pre-Invoke { "if [ -x /usr/bin/dpkg-divert ] && [ -f /usr/share/shadow/aspell-autobuildhash.fixed ]; then dpkg-divert --local --no-rename --add /usr/sbin/aspell-autobuildhash >/dev/null 2>&1 || true; cp /usr/share/shadow/aspell-autobuildhash.fixed /usr/sbin/aspell-autobuildhash && chmod 755 /usr/sbin/aspell-autobuildhash; fi"; };
DPkg::Post-Invoke { "if [ -f /usr/share/shadow/aspell-autobuildhash.fixed ] && [ -f /usr/sbin/aspell-autobuildhash ] && ! grep -q 'Patched for live-build' /usr/sbin/aspell-autobuildhash; then cp /usr/share/shadow/aspell-autobuildhash.fixed /usr/sbin/aspell-autobuildhash && chmod 755 /usr/sbin/aspell-autobuildhash; fi"; };
