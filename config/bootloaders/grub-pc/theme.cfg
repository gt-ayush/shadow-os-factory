# /boot/grub/theme.cfg
#
# Shadow OS override of live-build's default GRUB theme selection.
#
# live-build copies everything from config/bootloaders/grub-pc/ into
# /boot/grub/ (see /usr/lib/live/build/binary_grub_cfg). This file is sourced
# by /boot/grub/config.cfg and by every submenu entry, so it is the correct
# single place to choose the theme.

set color_normal=light-gray/black
set color_highlight=white/dark-gray

if [ -e /boot/grub/themes/particle/theme.txt ]; then
    # Shadow OS branded theme (config/bootloaders/grub-pc/themes/particle)
    set theme=/boot/grub/themes/particle/theme.txt
elif [ -e /boot/grub/splash.png ]; then
    # live-build default theme
    set theme=/boot/grub/live-theme/theme.txt
else
    # Plain text fallback
    set menu_color_normal=cyan/blue
    set menu_color_highlight=white/blue
fi
