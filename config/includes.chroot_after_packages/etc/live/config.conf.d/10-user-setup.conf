# Shadow OS live-config settings (Debian Live Manual: variables only).
# Do NOT put commands here; this file is sourced by live-config init.

LIVE_HOSTNAME="shadow-os"
LIVE_USERNAME="user"
LIVE_USER_FULLNAME="Shadow OS Live User"

# Use only groups that exist in the target system. Avoid groups like
# powerdev/scanner if not present (they can break live-config user-setup).
LIVE_USER_DEFAULT_GROUPS="audio,cdrom,dip,floppy,video,plugdev,netdev,bluetooth,sudo"

# Note: stock live-config 0030-user-setup (11.x) does not read LIVE_PASSWORD.
# Handle password/autologin via a proper /lib/live/config hook/component or
# compatible SDDM/live-config mechanism (separately).
